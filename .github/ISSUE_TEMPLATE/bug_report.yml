name: Bug report
description: Report a reproducible problem in the native app.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include settings/input format and what you expected versus what happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Useful evidence
      description: Optional redacted report, screenshot or tiny synthetic/licensed example. Do not upload private audio or sensitive paths.
