name: Native checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Set up stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release --all-targets
      - run: cargo build --locked --release --bins
      - run: cargo fmt --manifest-path ../mcp/server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path ../mcp/server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --release --manifest-path ../mcp/server/Cargo.toml --all-targets
      - run: cargo build --locked --release --manifest-path ../mcp/server/Cargo.toml
      - name: Verify MCP over stdio
        run: python ../mcp/tools/verify_mcp.py --server ../mcp/server/target/release/slimeybeats-mcp.exe
      - name: Verify Unicode connection setup in Windows PowerShell 5.1
        run: powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File ../mcp/tools/verify_connect_config.ps1 -Server ../mcp/server/target/release/slimeybeats-mcp.exe -Evidence '${{ runner.temp }}/SlimeyBeats-UTF8-config'
      - name: Verify Studio DSP routes and model-cache handling
        run: |
          python tools/test_stem_model_install.py
          python tools/test_installation_identity.py
          python tools/test_documentation_payload.py
          python tools/test_documentation_links.py
          python tools/test_license_payload.py
          python ../mcp/tools/verify_studio.py --server ../mcp/server/target/release/slimeybeats-mcp.exe
          python ../mcp/tools/verify_studio_origin.py --server ../mcp/server/target/release/slimeybeats-mcp.exe
          python ../mcp/tools/verify_nine_stems.py --server ../mcp/server/target/release/slimeybeats-mcp.exe
          python ../mcp/tools/verify_unbounded_stems.py --server ../mcp/server/target/release/slimeybeats-mcp.exe
          python ../mcp/tools/verify_stem_bundles.py --server ../mcp/server/target/release/slimeybeats-mcp.exe
      - name: Build and check isolated VST3 worker
        run: |
          cargo fmt --manifest-path ../plugins/host/Cargo.toml -- --check
          cargo clippy --locked --manifest-path ../plugins/host/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --release --manifest-path ../plugins/host/Cargo.toml
          python ../mcp/tools/verify_plugin_faults.py --server ../mcp/server/target/release/slimeybeats-mcp.exe
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build and validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libudev-dev xvfb xauth ffmpeg fonts-dejavu-core xdg-utils
      - name: Set up stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release --all-targets
      - run: cargo build --locked --release --bins
      - name: Verify Linux exports, XDG paths and native GUI captures
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 tools/verify_linux.py --gui target/release/slimeybeats-ez-master-live --out '${{ runner.temp }}/SlimeyBeats-Linux-Checks'
      - name: Check headless CLI without desktop features
        run: cargo check --locked --no-default-features --bin slimeybeats-ez-master-cli
      - run: cargo fmt --manifest-path ../mcp/server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path ../mcp/server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --release --manifest-path ../mcp/server/Cargo.toml --all-targets
      - run: cargo build --locked --release --manifest-path ../mcp/server/Cargo.toml
      - name: Verify MCP over stdio and six codecs
        run: python3 ../mcp/tools/verify_mcp.py --server ../mcp/server/target/release/slimeybeats-mcp --codecs
      - name: Verify Studio DSP routes and model-cache handling
        run: |
          python3 tools/test_stem_model_install.py
          python3 tools/test_installation_identity.py
          python3 tools/test_documentation_payload.py
          python3 tools/test_documentation_links.py
          python3 tools/test_license_payload.py
          python3 ../mcp/tools/verify_studio.py --server ../mcp/server/target/release/slimeybeats-mcp
          python3 ../mcp/tools/verify_studio_origin.py --server ../mcp/server/target/release/slimeybeats-mcp
          python3 ../mcp/tools/verify_nine_stems.py --server ../mcp/server/target/release/slimeybeats-mcp
          python3 ../mcp/tools/verify_unbounded_stems.py --server ../mcp/server/target/release/slimeybeats-mcp
          python3 ../mcp/tools/verify_stem_bundles.py --server ../mcp/server/target/release/slimeybeats-mcp --codecs
      - name: Build and check isolated VST3 worker
        run: |
          cargo fmt --manifest-path ../plugins/host/Cargo.toml -- --check
          cargo clippy --locked --manifest-path ../plugins/host/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --release --manifest-path ../plugins/host/Cargo.toml
          python3 ../mcp/tools/verify_plugin_faults.py --server ../mcp/server/target/release/slimeybeats-mcp
      - uses: actions/upload-artifact@v7
        with:
          name: SlimeyBeats-Linux-validation
          path: ${{ runner.temp }}/SlimeyBeats-Linux-Checks
          if-no-files-found: error
