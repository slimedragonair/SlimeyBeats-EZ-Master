name: Package Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build native binaries
        run: |
          rustup default stable
          cargo build --locked --release --bins --manifest-path rust/Cargo.toml
      - name: Assemble portable, source and installer
        run: python rust/tools/build_release.py --out dist
      - name: Verify command-line installer lifecycle
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-Setup.exe).FullName
          python rust/tools/verify_installer.py --installer "$setup" --test-root "${{ runner.temp }}/SlimeyBeats Installer QA" --report "${{ runner.temp }}/SlimeyBeats-QA/installer-check.json" --skip-gui
      - name: Build MCP companion preview
        run: cargo build --locked --release --manifest-path mcp/server/Cargo.toml
      - name: Assemble separate MCP preview ZIP
        run: python mcp/tools/package_companion.py --out dist/MCP
      - uses: actions/upload-artifact@v7
        with:
          name: SlimeyBeats-MCP-preview
          path: dist/MCP/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: SlimeyBeats-installer-verification
          path: ${{ runner.temp }}/SlimeyBeats-QA/installer-check.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: SlimeyBeats-Windows-release
          path: |
            dist/*-Setup.exe
            dist/*.zip
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
