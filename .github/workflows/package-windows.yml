name: Package Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build native binaries
        run: |
          rustup default stable
          cargo build --locked --release --bins --manifest-path rust/Cargo.toml
          cargo build --locked --release --manifest-path mcp/server/Cargo.toml
          cargo build --locked --release --manifest-path plugins/host/Cargo.toml
      - name: Assemble portable, source and installer
        run: python rust/tools/build_release.py --out dist
      - name: Verify release files and all offline guides
        shell: pwsh
        run: |
          $version = python -c "import tomllib;print(tomllib.load(open('rust/Cargo.toml','rb'))['package']['version'])"
          python rust/tools/verify_release_contents.py --folder "dist/SlimeyBeats-EZ-Master-$version" --source "dist/SlimeyBeats-EZ-Master-$version-Source.zip" --report "${{ runner.temp }}/SlimeyBeats-QA/release-contents.json"
      - name: Verify command-line installer lifecycle
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-Setup.exe).FullName
          $channel = python -c "import sys,tomllib;sys.path.insert(0,'rust/tools');from release_packaging.installation_identity import for_version;print(for_version(tomllib.load(open('rust/Cargo.toml','rb'))['package']['version']).channel)"
          python rust/tools/verify_installer.py --installer "$setup" --channel "$channel" --test-root "${{ runner.temp }}/SlimeyBeats Installer QA" --report "${{ runner.temp }}/SlimeyBeats-QA/installer-check.json" --skip-gui
      - name: Assemble separate MCP preview ZIP
        run: python mcp/tools/package_companion.py --out dist/MCP
      - uses: actions/upload-artifact@v7
        with:
          name: SlimeyBeats-MCP-preview
          path: dist/MCP/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: SlimeyBeats-installer-verification
          path: ${{ runner.temp }}/SlimeyBeats-QA/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: SlimeyBeats-Windows-release
          path: |
            dist/*-Setup.exe
            dist/*.zip
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
