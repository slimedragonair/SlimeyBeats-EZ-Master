name: Browser preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust and WebAssembly
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy
      - name: Install matching wasm-bindgen CLI
        run: |
          curl --fail --location --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz -o /tmp/wasm-bindgen.tar.gz
          echo '9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  /tmp/wasm-bindgen.tar.gz' | sha256sum --check
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          echo '/tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl' >> "$GITHUB_PATH"
      - name: Check binding crate
        run: |
          cargo fmt --manifest-path web/dsp/Cargo.toml -- --check
          cargo clippy --locked --manifest-path web/dsp/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked --manifest-path web/dsp/Cargo.toml --lib
          python3 -m unittest discover -s web/tools -p 'test_*.py'
      - name: Build static site and license inventory
        run: python3 web/tools/build.py
      - name: Install browser test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio
          pulseaudio --daemonize=yes --exit-idle-time=-1 --load='module-null-sink sink_name=slimeybeats_test'
          echo 'PULSE_SINK=slimeybeats_test' >> "$GITHUB_ENV"
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium firefox webkit
      - name: Verify MP3 timing against independent decoded PCM
        run: |
          python3 web/tools/verify_gapless.py --out '${{ runner.temp }}/browser-checks/gapless-chromium'
          python3 web/tools/verify_gapless.py --browser firefox --out '${{ runner.temp }}/browser-checks/gapless-firefox'
          python3 web/tools/verify_gapless.py --browser webkit --out '${{ runner.temp }}/browser-checks/gapless-webkit'
      - name: Verify long WAV and MP3 imports in three engines
        run: |
          python3 web/tools/verify_imports.py --out '${{ runner.temp }}/browser-checks/imports-chromium'
          python3 web/tools/verify_imports.py --browser firefox --out '${{ runner.temp }}/browser-checks/imports-firefox'
          python3 web/tools/verify_imports.py --browser webkit --out '${{ runner.temp }}/browser-checks/imports-webkit'
      - name: Verify Chromium
        run: python3 web/tools/verify_browser.py --out '${{ runner.temp }}/browser-checks/chromium'
      - name: Verify Firefox
        run: python3 web/tools/verify_browser.py --browser firefox --out '${{ runner.temp }}/browser-checks/firefox'
      - name: Verify WebKit
        run: python3 web/tools/verify_browser.py --browser webkit --out '${{ runner.temp }}/browser-checks/webkit'
      - name: Verify repeated track replacement and export
        run: python3 web/tools/verify_memory.py --tracks 4 --seconds 10 --out '${{ runner.temp }}/browser-checks/replacement'
      - name: Verify Studio editing in three engines
        run: |
          python3 web/tools/verify_studio_browser.py --out '${{ runner.temp }}/browser-checks/studio-chromium'
          python3 web/tools/verify_studio_browser.py --browser firefox --out '${{ runner.temp }}/browser-checks/studio-firefox'
          python3 web/tools/verify_studio_browser.py --browser webkit --out '${{ runner.temp }}/browser-checks/studio-webkit'
      - name: Verify Studio replacement and decoded input bounds
        run: python3 web/tools/verify_studio_memory.py --tracks 4 --seconds 10 --check-limits --out '${{ runner.temp }}/browser-checks/studio-memory'
      - name: Verify audible live stems and exclusive playback in three engines
        run: |
          python3 web/tools/verify_studio_live.py --out '${{ runner.temp }}/browser-checks/studio-live-chromium'
          python3 web/tools/verify_studio_live.py --browser firefox --out '${{ runner.temp }}/browser-checks/studio-live-firefox'
          python3 web/tools/verify_studio_live.py --browser webkit --out '${{ runner.temp }}/browser-checks/studio-live-webkit'
      - name: Verify learning, persistent choices and compact layouts
        run: |
          python3 web/tools/verify_learning_browser.py --out '${{ runner.temp }}/browser-checks/learning-chromium'
          python3 web/tools/verify_learning_browser.py --browser firefox --out '${{ runner.temp }}/browser-checks/learning-firefox'
          python3 web/tools/verify_learning_browser.py --browser webkit --out '${{ runner.temp }}/browser-checks/learning-webkit'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SlimeyBeats-browser-validation
          path: ${{ runner.temp }}/browser-checks
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: web/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish private-processing static preview
        id: deployment
        uses: actions/deploy-pages@v4
