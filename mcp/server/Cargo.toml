[package]
name = "slimeybeats-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local MCP companion for the SlimeyBeats desktop mastering engine"
repository = "https://github.com/slimedragonair/SlimeyBeats-EZ-Master"

[dependencies]
mastercraft = { path = "../../rust", default-features = false }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
hound = "3.5"

[profile.release]
lto = "thin"
codegen-units = 1
