[package]
name = "slimeybeats-vst3-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Isolated offline VST3 effect worker for SlimeyBeats"

[dependencies]
mastercraft = { path = "../../rust", default-features = false }
vst3 = "=0.3.0"
libloading = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
