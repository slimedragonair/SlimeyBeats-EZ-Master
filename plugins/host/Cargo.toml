[package]
name = "slimeybeats-vst3-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Isolated offline VST3 effect worker for SlimeyBeats"

[dependencies]
mastercraft = { path = "../../rust", default-features = false }
vst3 = "=0.3.0"
libloading = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
