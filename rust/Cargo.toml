[package]
name = "mastercraft"
version = "0.5.0-beta.3"
edition = "2024"
description = "Native offline mastering, analysis and auditioning"
license = "MIT"
repository = "https://github.com/slimedragonair/SlimeyBeats-EZ-Master"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rodio", "dep:rfd", "dep:image"]
schemas = ["dep:schemars"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
ebur128 = "0.1.11"
glob = "0.3"
hound = "3.5"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rayon = "1.11"
rfd = { version = "0.18", optional = true }
rodio = { version = "0.21.1", optional = true, default-features = false, features = ["playback"] }
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", optional = true }
tempfile = "3"
zip = { version = "=9.4.2", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "slimeybeats-ez-master-live"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "slimeybeats-ez-master-cli"
path = "src/bin/mastercraft_cli.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
