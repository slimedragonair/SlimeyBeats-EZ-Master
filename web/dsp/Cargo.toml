[package]
name = "slimeybeats-web-dsp"
version = "0.3.0-beta.3"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mastercraft = { path = "../../rust", default-features = false }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
hound = "3.5"

[profile.release]
lto = "thin"
codegen-units = 1
