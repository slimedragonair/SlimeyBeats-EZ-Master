[package]
name = "slimeybeats-web-dsp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mastercraft = { path = "../../rust", default-features = false }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
serde_json = "1"
anyhow = "1"
hound = "3.5"

[profile.release]
lto = "thin"
codegen-units = 1
